apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "practice4.fullname" . }}-config
  labels:
    {{- include "practice4.labels" . | nindent 4 }}
data:
  NAME: {{ .Values.app.name | quote }}
  DB_HOST: {{ printf "%s-rw" .Values.postgres.clusterName | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
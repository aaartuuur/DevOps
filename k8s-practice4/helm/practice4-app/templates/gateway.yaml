apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "practice4.fullname" . }}-gateway
  labels:
    {{- include "practice4.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      hostname: {{ .Values.gateway.host | quote }}
      port: {{ .Values.gateway.httpPort }}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: {{ .Values.gateway.host | quote }}
      port: {{ .Values.gateway.httpsPort }}
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tlsSecretName }}
      allowedRoutes:
        namespaces:
          from: Same
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "practice4.fullname" . }}-route
  labels:
    {{- include "practice4.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "practice4.fullname" . }}-gateway
      sectionName: http
    - name: {{ include "practice4.fullname" . }}-gateway
      sectionName: https
  hostnames:
    - {{ .Values.gateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "practice4.fullname" . }}-app
          port: {{ .Values.service.port }}
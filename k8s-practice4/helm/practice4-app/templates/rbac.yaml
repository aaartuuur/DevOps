apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "practice4.fullname" . }}-reader
  labels:
    {{- include "practice4.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "practice4.fullname" . }}-reader-binding
  labels:
    {{- include "practice4.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "practice4.fullname" . }}-reader
  apiGroup: rbac.authorization.k8s.io